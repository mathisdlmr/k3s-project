---
name: Lint & Fix YAML files

# yamllint disable-line rule:truthy
on:
  push:

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint yamlfixer-opt-nc

      - name: Format YAML files
        run: |
          yamlfixer -c .yamllint --recurse -1 .

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(style): auto-format YAML"
          title: "📝 Auto-Format YAML files"
          body: |
            ## 📝 Auto-Format YAML files
            
            This PR has been created to fix YAML files that doesn't follow the `.yamllint` rules
          branch: bot/yaml-format
          delete-branch: true