apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets-rules
  labels:
    role: alert-rules
spec:
  groups:
    - name: external-secrets.rules
      rules:
        - alert: ExternalSecretNotReady
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.name }} ({{ $labels.exported_namespace }}) non Ready depuis 15min"
            description: "ESO n'arrive pas à synchroniser ce secret depuis Infisical, vérifier le SecretStore/ClusterSecretStore et les credentials."

        - alert: ClusterSecretStoreNotReady
          expr: clustersecretstore_status_condition{condition="Ready", status="False"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "ClusterSecretStore {{ $labels.name }} non Ready"
            description: "Le backend Infisical n'est plus joignable ou l'authentification a échoué, tous les ExternalSecrets utilisant ce store sont impactés."

        - alert: ExternalSecretsReconcileErrors
          expr: increase(controller_runtime_reconcile_errors_total{job=~"external-secrets.*"}[15m]) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Erreurs de reconcile sur {{ $labels.job }}"
            description: "{{ $labels.job }} rencontre des erreurs de reconcile répétées depuis 10min."
