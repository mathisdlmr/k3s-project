apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-rules
  labels:
    role: alert-rules
spec:
  groups:
    - name: k3s-etcd.rules
      rules:
        - alert: EtcdNoLeader
          expr: etcd_server_has_leader{job="k3s-etcd"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "etcd ({{ $labels.instance }}) n'a pas de leader"
            description: "Ce membre etcd embarqué dans k3s ne voit plus de leader depuis 3min, le control-plane HA est en danger."

        - alert: EtcdHighNumberOfLeaderChanges
          expr: increase(etcd_server_leader_changes_seen_total{job="k3s-etcd"}[15m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "etcd : élections de leader trop fréquentes"
            description: "Plus de 3 changements de leader en 15min, signe d'instabilité réseau entre les 3 NUCs (Tailscale ?) ou de latence disque."

        - alert: EtcdHighFsyncDuration
          expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="k3s-etcd"}[5m])) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "etcd ({{ $labels.instance }}) : fsync WAL lent"
            description: "Le p99 de durée de fsync du WAL dépasse 500ms depuis 10min, le disque local-path est potentiellement saturé."

        - alert: EtcdDatabaseApproachingQuota
          expr: (etcd_mvcc_db_total_size_in_bytes{job="k3s-etcd"} / etcd_server_quota_backend_bytes{job="k3s-etcd"}) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "etcd ({{ $labels.instance }}) : base proche du quota"
            description: "La base etcd dépasse 85% du quota configuré, penser à défragmenter ou augmenter le quota."
