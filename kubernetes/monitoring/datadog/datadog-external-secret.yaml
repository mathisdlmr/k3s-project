---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: datadog-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: /monitoring/DATADOG_API_KEY
