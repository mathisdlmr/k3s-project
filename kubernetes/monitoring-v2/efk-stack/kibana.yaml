---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: efk-kibana
  namespace: monitoring-v2
spec:
  version: 8.12.2
  count: 1
  elasticsearchRef:
    name: efk-elasticsearch
  config:
    server.publicBaseUrl: "https://kibana.mdlmr.fr"
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 25m
              memory: 640Mi
            limits:
              memory: 1Gi
