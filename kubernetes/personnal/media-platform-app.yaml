---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-platform
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: personnal
    app.kubernetes.io/part-of: personnal
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: personnal
  destination:
    server: https://kubernetes.default.svc
    namespace: media-platform
  source:
    repoURL: https://github.com/mathisDlmr/media-platform.git
    targetRevision: main
    path: .
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
