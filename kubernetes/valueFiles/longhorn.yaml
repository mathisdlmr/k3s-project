---
preUpgradeChecker:
  jobEnabled: false # Helm-managed, conflict encountered with ArgoCD (https://longhorn.io/docs/1.12.0/deploy/install/install-with-argocd/)

persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 3
  defaultDataLocality: best-effort # keep 1 replica per node, best for my Tailscale network with latency

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  defaultDataLocality: best-effort
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

longhornUI:
  replicas: 1

longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

longhornGlobalManager:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi

ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.mdlmr.fr
  tls: false
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-auth@kubernetescrd,longhorn-rate-limit@kubernetescrd

metrics:
  serviceMonitor:
    enabled: true
