---
preUpgradeChecker:
  jobEnabled: false # Helm-managed, conflict encountered with ArgoCD (https://longhorn.io/docs/1.12.0/deploy/install/install-with-argocd/)

persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultClassReplicaCount: 3
  defaultDataLocality: best-effort # keep 1 replica per node, best for my Tailscale network with latency

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  defaultDataLocality: best-effort
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  concurrentReplicaRebuildPerNodeLimit: 1 # rebuild traffic goes through Tailscale (userspace WireGuard), parallel rebuilds (default 5) saturate tailscaled CPU

longhornUI:
  replicas: 1

longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

longhornGlobalManager:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi

ingress:
  enabled: true
  ingressClassName: traefik
  host: longhorn.mdlmr.fr
  tls: false
  annotations: # Seee here for correct annotations syntax : https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/ingress/#annotations
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-auth@kubernetescrd,longhorn-system-longhorn-rate-limit@kubernetescrd

metrics:
  serviceMonitor:
    enabled: true
