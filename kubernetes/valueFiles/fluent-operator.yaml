---
Kubernetes: true

operator:
  enable: true
  extraArgs:
    - --metrics-bind-address=:8080
    - --metrics-secure=false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: null # chart default sets a CPU limit
      memory: 128Mi
  serviceMonitor:
    enable: true

fluentbit:
  enable: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: null # chart default sets a CPU limit
      memory: 128Mi
  serviceMonitor:
    enable: true
  additionalVolumes:
    - name: es-ca-cert
      secret:
        secretName: efk-elasticsearch-es-http-certs-public
  additionalVolumesMounts:
    - name: es-ca-cert
      mountPath: /fluent-bit/es-certs
      readOnly: true

fluentd:
  enable: false
