# roles/argocd_bootstrap/tasks/main.yml
# Install ArgoCD using Helm and then create the bootstrap-app that deploy the rest of the repository

---
- name: Download Helm installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0755"

- name: Run Helm installation script
  ansible.builtin.command: /tmp/get_helm.sh
  args:
    creates: /usr/local/bin/helm
  changed_when: false

- name: Copy ArgoCD valueFile to the node
  ansible.builtin.copy:
    src: "{{ argocd_bootstrap_argocd_values_file }}"
    dest: /tmp/argocd-values.yaml
    mode: "0644"

- name: Copy Bootstrap app to the node
  ansible.builtin.copy:
    src: "{{ argocd_bootstrap_bootstrap_app_file }}"
    dest: /tmp/bootstrap-app.yaml
    mode: "0644"

- name: Install PyYAML
  ansible.builtin.apt:
    name: python3-yaml
    state: present

- name: Add Argo-Helm repository to Helm
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Install ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    create_namespace: true
    values_files:
      - /tmp/argocd-values.yaml
    kubeconfig: "{{ argocd_bootstrap_kubeconfig }}"

- name: Wait ArgoCD to be ready
  ansible.builtin.command: >-
    k3s kubectl rollout status deployment/argocd-server -n argocd --timeout=180s
  changed_when: false

- name: Deploy Bootstrap application
  ansible.builtin.command: k3s kubectl apply -f /tmp/bootstrap-app.yaml
  register: argocd_bootstrap_app
  changed_when: "'unchanged' not in argocd_bootstrap_app.stdout"

- name: Fetch initial ArgoCD secret
  ansible.builtin.command: >-
    k3s kubectl -n argocd get secret argocd-initial-admin-secret
    -o jsonpath={.data.password}
  register: argocd_bootstrap_pwd
  failed_when: false
  changed_when: false

- name: Display ArgoCD infos
  ansible.builtin.debug:
    msg: >-
      ArgoCD admin password : {{ (argocd_bootstrap_pwd.stdout | b64decode)
      if argocd_bootstrap_pwd.rc == 0 else 'secret initial déjà supprimé' }}
      - accès via : kubectl port-forward svc/argocd-server -n argocd 8080:443
