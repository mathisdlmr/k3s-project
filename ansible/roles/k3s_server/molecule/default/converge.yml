# molecule/default/converge.yml
# Purpose: bring the instance to the desired state by running the role under test.
# Molecule calls this playbook with `molecule converge`.

---
- name: Converge
  hosts: all
  gather_facts: true
  become: true
  vars:
    k3s_server_cluster_init: true
    k3s_server_snapshotter: native # overlayfs-on-overlayfs deadlocks containerd inside a Docker container
  tasks:
    - name: Apply role under test
      ansible.builtin.include_role:
        name: k3s_server
